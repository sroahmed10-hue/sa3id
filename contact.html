<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تواصل معنا</title>
<link rel="stylesheet" href="CSS/style.css">
<script>if(localStorage.style('logged')!=='yes'){window.location.href='index.html'}</script>
</head>
<body>
<header>
<div class="logo">💜 ساعد</div>
<nav>
<a href="about.html">عن المنصة</a>
<a href="services.html">الخدمات</a>
<a href="contact.html">تواصل</a>
<button class="logout-btn" onclick="logout()">تسجيل خروج</button>
</nav>
</header>
<div class="marquee"><span>📩 تواصل معنا - نرد عليك في أقل من 24 ساعة 💜</span></div>
<div class="content">
<h2>تواصل معنا</h2>
<form onsubmit="sendMsg(event)">
<input type="text" placeholder="اسمك" required>
<input type="email" placeholder="ايميلك" required>
<select required><option value="">اختر الخدمة</option><option>برمجة</option><option>تصميم</option><option>مونتاج</option><option>ترجمة</option><option>بحوث</option><option>دروس</option></select>
<textarea placeholder="رسالتك..." required></textarea>
<button type="submit" class="send-btn">إرسال الرسالة</button>
</form>
</div>
<script>function logout(){localStorage.clear();window.location.href='index.html'}function sendMsg(e){e.preventDefault();alert("✅ تم ارسال رسالتك بنجاح!");e.target.reset();}</script>
</body>
</html>
