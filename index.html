<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ساعد - دخول</title>
<style>
*{box-sizing:border-box}
img{max-width:100%;height:auto;display:block}
:root{--bg:linear-gradient(135deg,#f5f0ff,#e0f0ff);--card:white;--text:#333}
body.dark{--bg:linear-gradient(135deg,#1a1a2e,#2d2d44);--card:#2a2a4a;--text:#f5f0ff}
body.purple{--bg:linear-gradient(135deg,#4a3aff,#8a4bff);--card:#fff;--text:#1a1a2e}
body{margin:0;font-family:Tahoma;background:var(--bg);color:var(--text);transition:.4s;min-height:100vh;overflow-x:hidden}
.header{background:linear-gradient(90deg,#4a3aff,#8a4bff);padding:14px 10px 8px;text-align:center;color:white;position:sticky;top:0;z-index:1000}
.nav-links{display:flex;justify-content:center;align-items:center;flex-wrap:nowrap;white-space:nowrap;margin-top:10px;width:100%}
.nav-links a{color:white;text-decoration:none;padding:6px 12px;border-radius:20px;display:inline-block;font-size:14px;flex-shrink:0;border:2px solid transparent}
.nav-links a.active{background:white;color:#4a3aff;font-weight:bold}
.sep{color:rgba(255,255,255,.6);margin:0 2px}
.project-title{border:2px solid #ffeb3b;display:inline-block;padding:6px 18px;border-radius:30px;background:rgba(255,255,255,.15);font-size:22px;margin:0 0 8px}
.marquee{background:#ffeb3b;color:#1a1a2e;padding:8px 0;overflow:hidden;white-space:nowrap;font-weight:bold;width:100%;display:block;margin:8px 0}
.marquee span{display:inline-block;padding-left:100%;animation:scroll 12s linear infinite}
@keyframes scroll{0%{transform:translateX(100%)}100%{transform:translateX(-100%)}}
.theme-btn{position:fixed;bottom:20px;left:20px;background:white;color:#4a3aff;border:none;width:48px;height:48px;border-radius:50%;font-size:20px;box-shadow:0 5px 15px rgba(0,0,0,.2);cursor:pointer;z-index:2000}
</style>
</head>
<body>
<div class="header">
<h1 class="project-title">💜 ساعد SA3ID</h1>
<div class="marquee"><span>💜 مرحبا بكم في منصة ساعد - مهارات طلاب الرازي في مكان واحد 💜</span></div>
<div class="nav-links">
<a href="index.html" class="active">دخول</a><span class="sep">|</span>
<a href="about.html">عن ساعد</a><span class="sep">|</span>
<a href="services.html">الخدمات</a><span class="sep">|</span>
<a href="contact.html">تواصل</a>
</div>
</div>
<center>
<div style="background:var(--card);width:90%;max-width:420px;padding:20px;border-radius:15px;margin-top:25px;box-shadow:0 10px 25px rgba(0,0,0,.15);border-top:6px solid #4a3aff">


<img src="poster.jpg" alt="ساعد" style="width:100%;height:220px;object-fit:cover;border-radius:15px;margin:0 auto 18px;border:3px solid #4a3aff;box-shadow:0 5px 15px rgba(74,58,255,.3)">

<h2 style="color:#4a3aff;margin:0 0 15px">🔐 تسجيل الدخول</h2>
<input type="email" placeholder="ايميلك الجامعي" style="width:100%;padding:12px;border-radius:10px;border:1px solid #ccc;margin:8px 0">
<input type="password" placeholder="كلمة السر" style="width:100%;padding:12px;border-radius:10px;border:1px solid #ccc;margin:8px 0">
<button style="width:100%;padding:12px;background:linear-gradient(90deg,#4a3aff,#6a5cff);color:white;border:none;border-radius:10px;margin-top:15px;font-size:16px;cursor:pointer">دخول ✨</button>
</div>
</center>
<div style="background:#1a1a2e;color:#aaa;text-align:center;padding:15px;margin-top:30px"> ساعد © 2026 - مجمع الرازي</div>
<button class="theme-btn" onclick="changeTheme()">🎨</button>
<script>let t=['','dark','purple'],c=localStorage.getItem('saed-theme')||'';document.body.className=c;let i=t.indexOf(c);function changeTheme(){i=(i+1)%t.length;document.body.className=t[i];localStorage.setItem('saed-theme',t[i])}</script>
</body>
</html>
