<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ساعد - دخول</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">

    <div class="marquee">
        <span>💜 منصة ساعد لطلاب الرازي - خدمات تعليمية وتقنية مميزة 💜</span>
    </div>

    <div class="login-box">

        <img src="poster.jpg" alt="صورة منصة ساعد"
             style="display:block; width:100%; max-width:300px; height:auto; margin:0 auto 20px; border-radius:12px;">

        <h1>💜 ساعد</h1>
        <h2>مرحباً بك في منصة ساعد</h2>

        <form onsubmit="login(event)">
            <input type="text" id="username" placeholder="اسم المستخدم" required>
            <input type="password" id="password" placeholder="كلمة المرور" required>
            <button type="submit">تسجيل الدخول</button>
        </form>

    </div>

    <script>
        function login(event) {
            event.preventDefault();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            if (username !== '' && password !== '') {
                localStorage.setItem('logged', 'yes');
                window.location.href = 'about.html';
            }
        }
    </script>

</body>
</html>
